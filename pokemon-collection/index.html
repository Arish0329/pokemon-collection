<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>初代首刷寶可夢收藏 | Arish Collection</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07070f;
      --bg-card: #0d0d1e;
      --bg-card-hover: #131328;
      --border: #1e1e3a;
      --border-card: #34345a;   /* 卡片外框專用：比 --border 亮，讓卡片邊緣在深色背景上更清楚 */
      --border-holo: #c9a227;
      --glow-holo: rgba(201,162,39,0.4);
      --text: #d8d8ea;
      --text-dim: #5a5a7a;
      --gold: #c9a227;
      --gold-light: #f0d060;

      /* 評級徽章（冷色亮度階梯：越高分越亮；刻意不用金色，避免與閃卡混淆） */
      --grade10-bg: #d6eeff;  --grade10-fg: #0b3a5c;
      --grade9-bg:  #d8d8ea;  --grade9-fg:  #1a1a2e;
      --grade8-bg:  #4e5678;  --grade8-fg:  #f0f2ff;  --grade8-border: #7a84aa;
      --grade7-bg:  #2e3350;  --grade7-fg:  #c8cce0;  --grade7-border: #4e5678;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Nav Bar ── */
    .nav {
      display: flex;
      align-items: center;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(7,7,15,0.8);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-dim);
      text-decoration: none;
      padding: 6px 12px 6px 8px;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .nav-back:hover {
      color: var(--text);
      border-color: var(--border);
      background: rgba(255,255,255,0.04);
    }
    .nav-back-arrow { font-size: 0.9rem; }
    .nav-brand {
      margin-left: 16px;
      font-size: 0.72rem;
      letter-spacing: 0.25em;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .nav-brand span { color: var(--gold); }

    /* ── Header ── */
    .header {
      text-align: center;
      padding: 56px 20px 44px;
      background: linear-gradient(180deg, #0e0e28 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(201,162,39,0.07) 0%, transparent 70%);
      pointer-events: none;
    }
    .header-titles {
      display: inline-block;
    }
    .header-eyebrow {
      font-size: clamp(1.3rem, 3.6vw, 2.1rem);
      font-weight: 900;
      color: var(--gold);
      margin-bottom: 0px;
      line-height: 1;
      letter-spacing: 0.15em;
    }
    .header-title {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.04em;
      text-shadow: 0 0 40px rgba(201,162,39,0.25);
    }
    .header-sub {
      margin-top: 10px;
      font-size: 0.82rem;
      color: #9090b0;
      letter-spacing: 0.12em;
    }

    /* ── Stats ── */
    .stats-wrap {
      max-width: 940px;
      margin: 0 auto;
      padding: 28px 24px 0;
    }
    .stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .stats-main {
      font-size: 0.9rem;
      color: var(--text-dim);
    }
    .stats-number {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--gold);
    }
    .stats-badges {
      display: flex;
      gap: 10px;
    }
    .badge {
      font-size: 0.72rem;
      padding: 3px 11px;
      border-radius: 20px;
      border: 1px solid;
      white-space: nowrap;
    }
    .badge-holo  { border-color: var(--gold);   color: var(--gold); }
    .badge-common{ border-color: var(--border); color: var(--text-dim); }
    .progress-bar {
      width: 100%;
      height: 5px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 28px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      border-radius: 3px;
      transition: width 1s ease;
      width: 0%;
    }

    /* ── Filters ── */
    .filters-wrap {
      max-width: 940px;
      margin: 0 auto;
      padding: 0 24px 22px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 5px 15px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
      transition: all 0.18s;
    }
    .filter-btn:hover { border-color: var(--gold); color: var(--gold); }
    .filter-btn.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #000;
      font-weight: 700;
    }

    /* ── Grid ── */
    .grid-wrap {
      max-width: 940px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      /* 上下間距比左右大：每排卡片之間有呼吸空間，滑過時的光暈也不會擠到下一排 */
      row-gap: 28px;
      column-gap: 14px;
    }
    @media (max-width: 600px) {
      .card-grid { grid-template-columns: repeat(2, 1fr); row-gap: 20px; column-gap: 10px; }
      .grid-wrap, .filters-wrap, .stats-wrap { padding-left: 14px; padding-right: 14px; }
    }
    @media (min-width: 601px) and (max-width: 820px) {
      .card-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* ── Card ── */
    .card {
      border-radius: 10px;
      border: 1.5px solid var(--border-card);
      background: var(--bg-card);
      overflow: hidden;
      position: relative;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .card.collected { cursor: pointer; }
    .card.collected:hover { transform: translateY(-4px); }
    /* 閃卡靜止時與普卡相同（靠卡殼標籤、篩選與放大檢視辨識）；滑過時只有金色光暈向外擴散（不加金框）。
       :active 讓手機（沒有 hover）點按時也有短暫發光回饋 */
    .card.holo.collected:hover,
    .card.holo.collected:active {
      box-shadow:
        0 0 22px rgba(201,162,39,0.34),
        0 0 48px rgba(201,162,39,0.14),
        0 8px 24px rgba(0,0,0,0.6);
    }

    /* 普卡滑過：與閃卡同邏輯（不變框、只發光），用銀色光暈（兩層：近處較亮、遠處擴散）。
       強度與閃卡金光相同（0.34 / 0.14），兩者只靠顏色區分：金＝閃卡、銀＝普卡 */
    .card.common.collected:hover,
    .card.common.collected:active {
      box-shadow:
        0 0 22px rgba(170, 180, 220, 0.34),
        0 0 48px rgba(170, 180, 220, 0.14),
        0 8px 24px rgba(0,0,0,0.5);
    }
    .card.hidden { display: none; }

    /* Card image — PSA scan ratio 380x639 */
    .card-img-wrap {
      width: 100%;
      aspect-ratio: 380 / 639;
      position: relative;
      overflow: hidden;
      background: #060612;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s;
    }
    .card.collected:hover .card-img-wrap img { transform: scale(1.04); }

    /* Placeholder */
    .card-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: radial-gradient(circle at 50% 60%, #0d0d22 0%, #060610 80%);
    }
    .placeholder-icon { opacity: 0.15; width: 36px; height: 36px; }
    .placeholder-label {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      opacity: 0.5;
    }

    /* Card info */
    .card-info {
      padding: 8px 10px 9px;
    }
    /* 有評級時：左欄三行文字、右欄評級章（垂直置中），左右份量對等 */
    .card-info.has-grade {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      column-gap: 8px;
      align-items: center;
    }
    .card-text { min-width: 0; }   /* 讓長卡名能正常顯示省略號 */
    .card-num {
      font-size: 0.62rem;
      color: var(--text-dim);
      margin-bottom: 3px;
    }
    /* 卡名是資訊列主角：0.78rem(12.5px) → 0.95rem(15.2px) */
    .card-name {
      font-size: 0.95rem;
      line-height: 1.35;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    /* 括號舊名是補充資訊：縮小、降彩度；長名被截斷時優先截掉這段，現代名保持完整 */
    .card-name-old {
      font-size: 0.66rem;
      font-weight: 500;
      color: #8c8ca8;
      margin-left: 2px;
    }
    @media (max-width: 600px) {
      .card-name { font-size: 0.88rem; }   /* 手機卡片較窄：14.1px，仍比原本大約 13% */
    }
    .card-en {
      font-size: 0.66rem;
      color: #8c8ca8;
      letter-spacing: 0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
    }
    /* 閃卡文字與普卡同色：金色只留給滑過時的光暈，避免金色過多搶走卡名可讀性 */



    /* Grade badge（直式評級章：小字機構名 + 大數字分數，仿 PSA 標籤；
       放在資訊列右欄、與左側三行文字垂直置中，大數字與大卡名左右呼應） */
    .grade-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 38px;
      padding: 5px 7px;
      border-radius: 6px;
      border: 1px solid transparent;
      line-height: 1;
      transition: filter 0.2s ease;
    }
    .grade-co {
      display: inline-flex; align-items: center; gap: 2px;
      font-size: 0.48rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      opacity: 0.85;
    }
    .grade-score {
      font-size: 1.05rem;
      font-weight: 900;
    }
    .grade-badge svg { width: 8px; height: 8px; }
    .card.collected:hover .grade-badge { filter: brightness(1.12); }
    .grade-10 { background: var(--grade10-bg); color: var(--grade10-fg); }
    .grade-9  { background: var(--grade9-bg);  color: var(--grade9-fg); }
    .grade-8  { background: var(--grade8-bg);  color: var(--grade8-fg); border-color: var(--grade8-border); }
    .grade-7  { background: var(--grade7-bg);  color: var(--grade7-fg); border-color: var(--grade7-border); }

    /* ── Lightbox ── */
    .lightbox {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.93);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .lightbox.open { display: flex; }
    .lightbox-inner {
      position: relative;
      max-width: 340px;
      width: 100%;
      text-align: center;
    }
    .lightbox-img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 0 50px rgba(0,0,0,0.9);
    }
    .lightbox-holo { border: 2px solid var(--gold); box-shadow: 0 0 30px var(--glow-holo); }
    .lightbox-info { margin-top: 18px; }
    .lightbox-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
    }
    .lightbox-sub {
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-top: 5px;
    }
    .lightbox-close {
      position: absolute;
      top: -44px; right: 0;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      width: 32px; height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.15s;
    }
    .lightbox-close:hover { border-color: var(--text); }

    /* ── Search ── */
    .search-wrap {
      max-width: 940px;
      margin: 0 auto;
      padding: 0 24px 22px;
    }
    .search-box { position: relative; display: flex; align-items: center; }
    .search-box > svg {
      position: absolute; left: 14px;
      width: 16px; height: 16px;
      stroke: var(--text-dim);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      height: 44px;
      padding: 0 44px 0 40px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input::placeholder { color: var(--text-dim); }
    .search-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,162,39,0.15);
    }
    .search-clear {
      position: absolute; right: 8px;
      width: 28px; height: 28px;
      border: none; background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      border-radius: 50%;
      font-size: 0.9rem;
      display: none; align-items: center; justify-content: center;
      transition: color 0.15s, background 0.15s;
    }
    .search-clear:hover { color: var(--text); background: rgba(255,255,255,0.06); }
    .search-clear.show { display: flex; }
    .search-count {
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--text-dim);
      min-height: 1em;
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 52px 20px;
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    /* ── Lightbox nav & English name ── */
    .lightbox-nav {
      position: absolute;
      top: 38%;
      transform: translateY(-50%);
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(13,13,30,0.7);
      backdrop-filter: blur(4px);
      color: var(--text);
      font-size: 1.4rem; line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.15s, background 0.15s, opacity 0.15s;
      z-index: 2;
    }
    .lightbox-nav:hover { border-color: var(--gold); background: rgba(13,13,30,0.95); }
    .lightbox-nav:disabled { opacity: 0.2; cursor: default; border-color: var(--border); }
    .lightbox-prev { left: -56px; }
    .lightbox-next { right: -56px; }
    .lightbox-en {
      font-size: 0.85rem;
      color: var(--gold);
      letter-spacing: 0.04em;
      margin-top: 4px;
    }
    .lightbox-cert {
      display: none;
      align-items: center;
      gap: 7px;
      margin-top: 16px;
      padding: 10px 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
    }
    .lightbox-cert:hover { border-color: var(--gold); background: rgba(201,162,39,0.1); color: var(--gold-light); }
    .lightbox-cert span { color: var(--text-dim); font-weight: 400; font-size: 0.72rem; letter-spacing: 0.02em; }
    @media (max-width: 480px) {
      .lightbox-prev { left: 6px; }
      .lightbox-next { right: 6px; }
      .lightbox-nav { background: rgba(13,13,30,0.88); }
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 30px 20px;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

<!-- Navigation -->
<nav class="nav">
  <a class="nav-back" href="../index.html">
    <span class="nav-back-arrow">←</span>
    返回首頁
  </a>
  <span class="nav-brand">Arish <span>Collection</span></span>
</nav>

<header class="header">
  <div class="header-titles">
    <p class="header-eyebrow">Pokémon Collection</p>
    <h1 class="header-title">初代首刷寶可夢收藏</h1>
  </div>
  <p class="header-sub">1st Edition · Traditional Chinese · Base Set · 102/102</p>
</header>

<div class="stats-wrap">
  <div class="stats-row">
    <span class="stats-main">收藏進度</span>
    <div class="stats-badges">
      <span class="badge badge-holo"  id="badge-holo">閃卡 0 / 16</span>
      <span class="badge badge-common" id="badge-common">一般 0 / 86</span>
    </div>
    <span class="stats-number"><span id="stats-n">0</span> <span style="font-size:0.9rem;font-weight:400;color:var(--text-dim)">/ 102</span></span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
</div>

<div class="filters-wrap">
  <button class="filter-btn active" data-filter="all">全部</button>
  <button class="filter-btn" data-filter="holo">閃卡寶可夢</button>
  <button class="filter-btn" data-filter="pokemon">普卡寶可夢</button>
  <button class="filter-btn" data-filter="trainer">訓練師／道具</button>
  <button class="filter-btn" data-filter="energy">能量</button>
  <button class="filter-btn" data-filter="collected">已收藏</button>
  <button class="filter-btn" data-filter="missing">未收藏</button>
</div>

<div class="search-wrap">
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" class="search-input" id="search-input" placeholder="搜尋名稱或編號…（例：噴火龍 / 艾比郎 / Charizard / 4）" autocomplete="off" aria-label="搜尋卡片">
    <button class="search-clear" id="search-clear" aria-label="清除搜尋" type="button">✕</button>
  </div>
  <div class="search-count" id="search-count" aria-live="polite"></div>
</div>

<div class="grid-wrap">
  <div class="card-grid" id="card-grid"></div>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <button class="lightbox-close" id="lightbox-close" aria-label="關閉" type="button">✕</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="上一張" type="button">‹</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="">
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="下一張" type="button">›</button>
    <div class="lightbox-info">
      <div class="lightbox-name" id="lightbox-name"></div>
      <div class="lightbox-en" id="lightbox-en"></div>
      <div class="lightbox-sub" id="lightbox-sub"></div>
      <a class="lightbox-cert" id="lightbox-cert" target="_blank" rel="noopener">查驗證書 <span>Cert Verification ↗</span></a>
    </div>
  </div>
</div>

<footer>Pokémon TCG © Nintendo / Creatures Inc. / GAME FREAK inc. &nbsp;·&nbsp; 個人收藏展示，非商業用途</footer>

<script>
const CARDS = [
  // ─── HOLO (No.1–16) ───
  { id:1,  name:'胡地',        cat:'holo',    holo:true  },
  { id:2,  name:'水箭龜',      cat:'holo',    holo:true  },
  { id:3,  name:'吉利蛋',      cat:'holo',    holo:true  },
  { id:4,  name:'噴火龍',      cat:'holo',    holo:true  },

const GRADE_LABEL = { 10:'GEM MT', 9:'MINT', 8:'NM-MT', 7:'NM' };

function certUrl(s) {
  return s.co === 'CGC'
    ? `https://www.cgccards.com/certlookup/${s.cert}`
    : `https://www.psacard.com/cert/${s.cert}/psa`;
}

function gradeText(id) {
  const s = SLABS[id];
  if (!s) return '';
  return `${s.co} ${s.score}${GRADE_LABEL[s.score] ? ' ' + GRADE_LABEL[s.score] : ''}`;
}

function gradeBadge(id) {
  const s = SLABS[id];
  if (!s) return null;
  const tier = s.score >= 10 ? 10 : s.score >= 9 ? 9 : s.score >= 8 ? 8 : 7;
  const el = document.createElement('div');
  el.className = `grade-badge grade-${tier}`;
  el.title = gradeText(id);
  el.setAttribute('aria-label', `評級 ${gradeText(id)}`);
  const diamond = tier === 10
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12l4 6-10 11L2 10z"/></svg>'
    : '';
  el.innerHTML = `<span class="grade-co" aria-hidden="true">${diamond}${s.co}</span>`
               + `<span class="grade-score" aria-hidden="true">${s.score}</span>`;
  return el;
}

// 「現代名(舊名)」拆成兩段：現代名大字，括號舊名小字（樣式見 .card-name-old）
function nameHtml(name) {
  const m = name.match(/^(.*?)(\(.*\))$/);
  return m ? `${m[1]}<span class="card-name-old">${m[2]}</span>` : name;
}

function matchSearch(card) {
  const q = searchQ.trim().toLowerCase();
  if (!q) return true;
  return card.name.toLowerCase().includes(q)
      || String(card.id).includes(q)
      || (EN_NAMES[card.id] || '').toLowerCase().includes(q);
}

// ── Load data ──
async function loadData() {
  try {
    const res = await fetch(`../data.json?t=${Date.now()}`);
    if (res.ok) {
      const data = await res.json();
      collected = new Set(data.collected || []);
    }
  } catch (_) {}
  render();
  updateStats();
}

// ── Render grid ──
function render() {
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';
  let visibleCount = 0;

  CARDS.forEach(card => {
    const isCollected = collected.has(card.id);
    const visible = matchFilter(card, isCollected) && matchSearch(card);
    if (visible) visibleCount++;

    const el = document.createElement('div');
    el.className = `card ${card.holo ? 'holo' : 'common'} ${isCollected ? 'collected' : ''} ${visible ? '' : 'hidden'}`;
    el.dataset.id = card.id;

    const imgWrap = document.createElement('div');
    imgWrap.className = 'card-img-wrap';

    if (isCollected) {
      const img = document.createElement('img');
      img.src = imgId(card.id);
      img.alt = card.name;
      img.loading = 'lazy';
      imgWrap.appendChild(img);

      el.addEventListener('click', () => openLightbox(card));
    } else {
      const ph = document.createElement('div');
      ph.className = 'card-placeholder';
      ph.innerHTML = `
        <svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <circle cx="12" cy="12" r="3" fill="none"/>
        </svg>
        <span class="placeholder-label">未收藏</span>`;
      imgWrap.appendChild(ph);
    }


    const info = document.createElement('div');
    info.className = 'card-info';
    info.innerHTML = `<div class="card-text">
        <div class="card-num">No.${card.id}</div>
        <div class="card-name" title="${card.name}">${nameHtml(card.name)}</div>
        <div class="card-en">${EN_NAMES[card.id] || ''}</div>
      </div>`;

    if (isCollected) {
      const grade = gradeBadge(card.id);
      if (grade) {
        info.classList.add('has-grade');
        info.appendChild(grade);
      }
    }

    el.appendChild(imgWrap);
    el.appendChild(info);
    grid.appendChild(el);
  });

  if (visibleCount === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = searchQ ? `找不到符合「${searchQ}」的卡片` : '沒有符合條件的卡片';
    grid.appendChild(empty);
  }
  updateSearchCount(visibleCount);
}

function matchFilter(card, isCollected) {
  if (activeFilter === 'all')       return true;
  if (activeFilter === 'holo')      return card.holo;
  if (activeFilter === 'pokemon')   return card.cat === 'pokemon';
  if (activeFilter === 'trainer')   return card.cat === 'trainer';
  if (activeFilter === 'energy')    return card.cat === 'energy';
  if (activeFilter === 'collected') return isCollected;
  if (activeFilter === 'missing')   return !isCollected;
  return true;
}

// ── Stats ──
function updateStats() {
  const total = collected.size;
  const holoCollected  = CARDS.filter(c => c.holo  && collected.has(c.id)).length;
  const commonCollected = CARDS.filter(c => !c.holo && collected.has(c.id)).length;

  document.getElementById('stats-n').textContent = total;
  document.getElementById('badge-holo').textContent   = `閃卡 ${holoCollected} / 16`;
  document.getElementById('badge-common').textContent = `一般 ${commonCollected} / 86`;
  document.getElementById('progress-fill').style.width = `${(total / 102 * 100).toFixed(1)}%`;
}

// ── Filter buttons ──
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    render();
  });
});

// ── Lightbox ──
let lbList = [];   // 目前可瀏覽的卡（受篩選 + 搜尋影響，且僅限已收藏）
let lbIndex = -1;

function getNavigableCards() {
  return CARDS.filter(card => {
    const isC = collected.has(card.id);
    return isC && matchFilter(card, isC) && matchSearch(card);
  });
}

function openLightbox(card) {
  lbList = getNavigableCards();
  lbIndex = lbList.findIndex(c => c.id === card.id);
  if (lbIndex < 0) { lbList = [card]; lbIndex = 0; }
  showLightboxAt(lbIndex);
  document.getElementById('lightbox').classList.add('open');
}

function showLightboxAt(i) {
  if (i < 0 || i >= lbList.length) return;
  lbIndex = i;
  const card = lbList[i];
  const img = document.getElementById('lightbox-img');
  img.src = imgId(card.id);
  img.alt = card.name;
  img.className = `lightbox-img${card.holo ? ' lightbox-holo' : ''}`;
  document.getElementById('lightbox-name').textContent = `No.${card.id} ${card.name}`;
  document.getElementById('lightbox-en').textContent = EN_NAMES[card.id] || '';
  document.getElementById('lightbox-sub').textContent =
    [card.holo ? '閃卡 HOLO' : catLabel(card.cat), gradeText(card.id), '初代首刷 · 繁體中文']
      .filter(Boolean).join(' · ');
  const slab = SLABS[card.id];
  const certBtn = document.getElementById('lightbox-cert');
  if (slab && slab.cert) { certBtn.href = certUrl(slab); certBtn.style.display = 'inline-flex'; }
  else { certBtn.style.display = 'none'; }
  document.getElementById('lightbox-prev').disabled = (i <= 0);
  document.getElementById('lightbox-next').disabled = (i >= lbList.length - 1);
}

function lbNav(delta) {
  const ni = lbIndex + delta;
  if (ni >= 0 && ni < lbList.length) showLightboxAt(ni);
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

function catLabel(cat) {
  return { pokemon:'普卡寶可夢卡', trainer:'訓練師／道具卡', energy:'能量卡', holo:'閃卡寶可夢' }[cat] || '';
}

document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
document.getElementById('lightbox-prev').addEventListener('click', e => { e.stopPropagation(); lbNav(-1); });
document.getElementById('lightbox-next').addEventListener('click', e => { e.stopPropagation(); lbNav(1); });
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === document.getElementById('lightbox')) closeLightbox();
});
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft')  lbNav(-1);
  else if (e.key === 'ArrowRight') lbNav(1);
});

// ── Search ──
const searchInput = document.getElementById('search-input');
const searchClear = document.getElementById('search-clear');
searchInput.addEventListener('input', () => {
  searchQ = searchInput.value;
  searchClear.classList.toggle('show', searchQ.length > 0);
  render();
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchQ = '';
  searchClear.classList.remove('show');
  render();
  searchInput.focus();
});

function updateSearchCount(n) {
  document.getElementById('search-count').textContent = searchQ ? `找到 ${n} 張` : '';
}

// iOS Safari 需要頁面上有 touchstart 監聽，CSS 的 :active（手機點按卡片發光）才會生效
document.addEventListener('touchstart', () => {}, { passive: true });

loadData();
</script>
